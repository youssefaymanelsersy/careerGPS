name: CD

on:
  push:
    #only run on main
    branches:
      - main

permissions:
  # needed to push to GHCR
  contents: read
  packages: write

jobs:
  # publish job is split into server and web
  publish:
    name: Build and push ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, web]
    
    # steps to be executed
    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Log in to GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the image for the current target
      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          # Use the root directory as the build context
          context: .
          # Use the Dockerfile from the current target's directory
          file: apps/${{ matrix.target }}/Dockerfile
          # Push the image to GHCR
          push: true
          # Tag the image with both a latest tag and a tag with the commit SHA 
          tags: |
            ghcr.io/${{ github.repository_owner }}/careergps-${{ matrix.target }}:latest
            ghcr.io/${{ github.repository_owner }}/careergps-${{ matrix.target }}:${{ github.sha }}
          # Pass build arguments to the Dockerfile
          build-args: |
            VITE_SERVER_URL=http://localhost:3000
            VITE_VAPID_PUBLIC_KEY=placeholder-vapid-key-for-ci-build-only
          # Cache the contents of the .turbo directory between runs.
          cache-from: type=gha,scope=${{ matrix.target }}
          # Use GitHub Actions cache for the current target in max mode.
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}